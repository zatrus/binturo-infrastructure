---
- name: Prepare local Jenkins configuration files
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    # This localhost-only play does not use the host Vault from group_vars/all.yml.
    # Override its become password reference so Jenkins Vault files can be managed
    # independently from infrastructure inventories.
    ansible_become_password: ""

  pre_tasks:
    - name: Load public Jenkins configuration
      ansible.builtin.include_vars:
        file: >-
          {{
            lookup(
              'ansible.builtin.first_found',
              {
                'files': ['jenkins-local.yml', 'jenkins-local.example.yml'],
                'paths': [playbook_dir ~ '/vars']
              }
            )
          }}

    - name: Load vaulted Jenkins configuration for every environment
      ansible.builtin.include_vars:
        file: >-
          {{
            lookup(
              'ansible.builtin.first_found',
              {
                'files': [
                  'jenkins-local-vault.' ~ item ~ '.yml',
                  'jenkins-local-vault.' ~ item ~ '.example.yml'
                ],
                'paths': [playbook_dir ~ '/vars']
              }
            )
          }}
      loop:
        - local
        - staging
        - production
      no_log: true

    - name: Assemble vaulted Jenkins environments
      ansible.builtin.set_fact:
        vault_jenkins_environments:
          local: "{{ vault_jenkins_local }}"
          staging: "{{ vault_jenkins_staging }}"
          production: "{{ vault_jenkins_production }}"
      no_log: true

  roles:
    - jenkins_local_config
