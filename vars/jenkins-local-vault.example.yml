---
# Copy to vars/jenkins-local-vault.yml, replace every CHANGE_ME value, then run:
# ansible-vault encrypt vars/jenkins-local-vault.yml
vault_jenkins_admin_password: CHANGE_ME

vault_jenkins_environments:
  local:
    organizers_db_password: CHANGE_ME
    platform_db_password: CHANGE_ME
    organizers_jwt_secret: CHANGE_ME_MINIMUM_32_RANDOM_CHARACTERS
    platform_jwt_secret: CHANGE_ME_DIFFERENT_MINIMUM_32_RANDOM_CHARACTERS
    organizers_ssh_private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      CHANGE_ME
      -----END OPENSSH PRIVATE KEY-----
    platform_ssh_private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      CHANGE_ME
      -----END OPENSSH PRIVATE KEY-----

  staging:
    organizers_db_password: CHANGE_ME
    platform_db_password: CHANGE_ME
    organizers_jwt_secret: CHANGE_ME_MINIMUM_32_RANDOM_CHARACTERS
    platform_jwt_secret: CHANGE_ME_DIFFERENT_MINIMUM_32_RANDOM_CHARACTERS
    organizers_ssh_private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      CHANGE_ME
      -----END OPENSSH PRIVATE KEY-----
    platform_ssh_private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      CHANGE_ME
      -----END OPENSSH PRIVATE KEY-----

  production:
    organizers_db_password: CHANGE_ME
    platform_db_password: CHANGE_ME
    organizers_jwt_secret: CHANGE_ME_MINIMUM_32_RANDOM_CHARACTERS
    platform_jwt_secret: CHANGE_ME_DIFFERENT_MINIMUM_32_RANDOM_CHARACTERS
    organizers_ssh_private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      CHANGE_ME
      -----END OPENSSH PRIVATE KEY-----
    platform_ssh_private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      CHANGE_ME
      -----END OPENSSH PRIVATE KEY-----
