---
# Copy to jenkins-local-vault.staging.yml, replace CHANGE_ME values, then run:
# ansible-vault encrypt --vault-id staging@prompt vars/jenkins-local-vault.staging.yml
vault_jenkins_staging:
  organizers_db_password: CHANGE_ME
  platform_db_password: CHANGE_ME
  organizers_jwt_secret: CHANGE_ME_MINIMUM_32_RANDOM_CHARACTERS
  platform_jwt_secret: CHANGE_ME_DIFFERENT_MINIMUM_32_RANDOM_CHARACTERS
  organizers_ssh_private_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    CHANGE_ME
    -----END OPENSSH PRIVATE KEY-----
  platform_ssh_private_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    CHANGE_ME
    -----END OPENSSH PRIVATE KEY-----
