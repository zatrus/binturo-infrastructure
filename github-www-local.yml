---
- name: Generate local GitHub Environment scripts for binturo-www
  hosts: hardened_hosts
  connection: local
  gather_facts: false
  become: false

  pre_tasks:
    - name: Load public binturo-www GitHub configuration
      ansible.builtin.include_vars:
        file: >-
          {{
            lookup(
              'ansible.builtin.first_found',
              {
                'files': ['github-www-local.yml', 'github-www-local.example.yml'],
                'paths': [playbook_dir ~ '/vars']
              }
            )
          }}

    - name: Map inventory environment to binturo-www GitHub Environment
      ansible.builtin.set_fact:
        github_environment_name: >-
          {{
            github_environment_name_map[environment_name]
            | default(environment_name)
          }}

  roles:
    - github_www_local_config
