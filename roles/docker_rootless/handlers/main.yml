---
- name: Restart rootless Docker
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.systemd:
    name: docker.service
    scope: user
    state: restarted
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ binturo_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ binturo_uid }}/bus"

