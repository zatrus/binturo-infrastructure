---
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Validate Caddy TLS mode
  ansible.builtin.assert:
    that:
      - (caddy_tls_internal | bool) != (caddy_tls_cloudflare_origin | bool)
      - caddy_bind_addresses | length > 0
      - binturo_domains.www | length > 0
      - binturo_domains.platform | length > 0
      - binturo_domains.organizers | length > 0
      - binturo_domains.api | length > 0
      - binturo_domains.values() | list | unique | length == 4
      - caddy_redirect_domains | length > 0
      - caddy_maintenance_dir | length > 0
      - caddy_maintenance_marker | regex_search('^[A-Za-z0-9_.-]+$')
      - caddy_maintenance_basic_auth_username | regex_search('^[A-Za-z0-9_.-]+$')
      - caddy_maintenance_basic_auth_password_hash | regex_search('^\$2[aby]\$')
      - caddy_maintenance_bypass_token | regex_search('^[A-Za-z0-9_-]{43,128}$')
      - caddy_maintenance_cookie_name | regex_search('^[A-Za-z0-9_-]+$')
      - caddy_maintenance_cookie_max_age | int > 0
      - caddy_maintenance_retry_after | int > 0
      - not (caddy_tls_cloudflare_origin | bool) or
        ((caddy_cloudflare_ipv4_ranges + caddy_cloudflare_ipv6_ranges) | length > 0)
      - not (caddy_tls_cloudflare_origin | bool) or
        (caddy_cloudflare_origin_certificate | default('') | trim | length > 0)
      - not (caddy_tls_cloudflare_origin | bool) or
        (caddy_cloudflare_origin_private_key | default('') | trim | length > 0)
    fail_msg: >-
      Select exactly one Caddy TLS mode. Local environments use
      caddy_tls_internal=true. Production uses
      caddy_tls_cloudflare_origin=true and must provide its Origin CA
      certificate and private key through Vault. Configure at least one Caddy
      bind address.
  no_log: true

- name: Allow Caddy to read Binturo application files
  ansible.builtin.user:
    name: caddy
    groups: "{{ binturo_group }}"
    append: true
  notify:
    - Validate and reload Caddy
    - Restart Caddy after group membership change

- name: Check whether Caddy is currently available
  ansible.builtin.command:
    cmd: caddy version
  check_mode: false
  changed_when: false
  failed_when: false
  register: caddy_cli_check

- name: Record Caddy availability
  ansible.builtin.set_fact:
    binturo_caddy_available: "{{ caddy_cli_check.rc == 0 }}"

- name: Create Caddy configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"
  loop:
    - /etc/caddy/snippets
    - "{{ caddy_dynamic_config_dir }}"
  when: not ansible_check_mode or binturo_caddy_available

- name: Create Caddy access log directory
  ansible.builtin.file:
    path: "{{ caddy_log_dir }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"
  when: not ansible_check_mode or binturo_caddy_available

- name: Create organizer maintenance directory
  ansible.builtin.file:
    path: "{{ caddy_maintenance_dir }}"
    state: directory
    owner: "{{ binturo_user }}"
    group: caddy
    mode: "0750"
  when: not ansible_check_mode or binturo_caddy_available

- name: Install organizer maintenance page
  ansible.builtin.template:
    src: maintenance.html.j2
    dest: "{{ caddy_maintenance_dir }}/index.html"
    owner: "{{ binturo_user }}"
    group: caddy
    mode: "0640"
  when: not ansible_check_mode or binturo_caddy_available

- name: Create Cloudflare Origin CA certificate directory
  ansible.builtin.file:
    path: "{{ caddy_cloudflare_cert_dir }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"
  when:
    - caddy_tls_cloudflare_origin | bool
    - not ansible_check_mode or binturo_caddy_available

- name: Install Cloudflare Origin CA certificate
  ansible.builtin.copy:
    content: "{{ caddy_cloudflare_origin_certificate | trim }}\n"
    dest: "{{ caddy_cloudflare_origin_certificate_path }}"
    owner: root
    group: caddy
    mode: "0640"
  no_log: true
  notify: Validate and reload Caddy
  when:
    - caddy_tls_cloudflare_origin | bool
    - not ansible_check_mode or binturo_caddy_available

- name: Install Cloudflare Origin CA private key
  ansible.builtin.copy:
    content: "{{ caddy_cloudflare_origin_private_key | trim }}\n"
    dest: "{{ caddy_cloudflare_origin_private_key_path }}"
    owner: root
    group: caddy
    mode: "0640"
  no_log: true
  notify: Validate and reload Caddy
  when:
    - caddy_tls_cloudflare_origin | bool
    - not ansible_check_mode or binturo_caddy_available

- name: Install main Caddy configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
  notify: Validate and reload Caddy
  when: not ansible_check_mode or binturo_caddy_available

- name: Install common Caddy snippet
  ansible.builtin.template:
    src: common.caddy.j2
    dest: /etc/caddy/snippets/common.caddy
    owner: root
    group: caddy
    mode: "0640"
  notify: Validate and reload Caddy
  when: not ansible_check_mode or binturo_caddy_available

- name: Install unknown domain redirect site
  ansible.builtin.template:
    src: redirect-site.caddy.j2
    dest: "{{ caddy_dynamic_config_dir }}/04-redirects.caddy"
    owner: root
    group: caddy
    mode: "0640"
  notify:
    - Validate and reload Caddy
    - Restart Caddy after access log configuration change
  when: not ansible_check_mode or binturo_caddy_available

- name: Remove obsolete organizers site files
  ansible.builtin.file:
    path: "{{ caddy_dynamic_config_dir }}/{{ item }}"
    state: absent
  loop:
    - 20-organizers-staff.caddy
    - 21-organizers-trainer.caddy
    - 22-organizers-client.caddy
    - 23-organizers-client.caddy
  notify: Validate and reload Caddy
  when: not ansible_check_mode or binturo_caddy_available

- name: Install Binturo application sites
  ansible.builtin.template:
    src: application-site.caddy.j2
    dest: "{{ caddy_dynamic_config_dir }}/{{ item.filename }}"
    owner: root
    group: caddy
    mode: "0640"
  loop:
    - filename: 10-platform.caddy
      domain: "{{ binturo_domains.platform }}"
      backend_port: "{{ binturo_ports.platform }}"
      frontend_root: "{{ binturo_frontend_roots.platform }}"
      log_filename: platform.log
  notify:
    - Validate and reload Caddy
    - Restart Caddy after access log configuration change
  when: not ansible_check_mode or binturo_caddy_available

- name: Install Binturo organizers site
  ansible.builtin.template:
    src: organizers-site.caddy.j2
    dest: "{{ caddy_dynamic_config_dir }}/20-organizers.caddy"
    owner: root
    group: caddy
    mode: "0640"
  notify:
    - Validate and reload Caddy
    - Restart Caddy after access log configuration change
  no_log: true
  when: not ansible_check_mode or binturo_caddy_available

- name: Install Binturo static website
  ansible.builtin.template:
    src: static-site.caddy.j2
    dest: "{{ caddy_dynamic_config_dir }}/05-www.caddy"
    owner: root
    group: caddy
    mode: "0640"
  notify:
    - Validate and reload Caddy
    - Restart Caddy after access log configuration change
  when: not ansible_check_mode or binturo_caddy_available

- name: Install organizers frontend loopback sites
  ansible.builtin.template:
    src: frontend-port.caddy.j2
    dest: "{{ caddy_dynamic_config_dir }}/{{ item.filename }}"
    owner: root
    group: caddy
    mode: "0640"
  loop:
    - filename: 30-organizers-staff-loopback.caddy
      port: "{{ binturo_frontend_ports.organizers_staff }}"
      frontend_root: "{{ binturo_frontend_roots.organizers_staff }}"
    - filename: 31-organizers-trainer-loopback.caddy
      port: "{{ binturo_frontend_ports.organizers_trainer }}"
      frontend_root: "{{ binturo_frontend_roots.organizers_trainer }}"
    - filename: 32-organizers-client-loopback.caddy
      port: "{{ binturo_frontend_ports.organizers_client }}"
      frontend_root: "{{ binturo_frontend_roots.organizers_client }}"
  notify: Validate and reload Caddy
  when: not ansible_check_mode or binturo_caddy_available

- name: Ensure Caddy is enabled and running
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
  when: binturo_caddy_available
