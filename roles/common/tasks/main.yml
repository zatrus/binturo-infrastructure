---
- name: Install base system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - uidmap
      - dbus-user-session
      - acl
      - ufw
      - python3
      - python3-docker
    state: present
    update_cache: true

- name: Set host timezone
  community.general.timezone:
    name: "{{ binturo_timezone }}"

- name: Allow OpenSSH through firewall
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow HTTP and HTTPS through firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Enable firewall with incoming traffic denied
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

