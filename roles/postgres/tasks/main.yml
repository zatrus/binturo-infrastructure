---
- name: Validate PostgreSQL role and schema model
  ansible.builtin.assert:
    that:
      - postgres_platform_user != postgres_organizers_user
      - postgres_organizers_group_role != postgres_organizers_user
      - postgres_organizers_group_role != postgres_platform_user
      - postgres_platform_user != postgres_backup_user
      - postgres_organizers_user != postgres_backup_user
      - (postgres_database | regex_search('^[a-z_][a-z0-9_]*$')) is not none
      - postgres_database != 'postgres'
      - (postgres_platform_user | regex_search('^[a-z_][a-z0-9_]*$')) is not none
      - (postgres_organizers_user | regex_search('^[a-z_][a-z0-9_]*$')) is not none
      - (postgres_organizers_group_role | regex_search('^[a-z_][a-z0-9_]*$')) is not none
      - (postgres_backup_user | regex_search('^[a-z_][a-z0-9_]*$')) is not none
      - (postgres_initial_schema | regex_search('^[a-z_][a-z0-9_]*$')) is not none
      - (postgres_organizers_schema | regex_search('^[a-z_][a-z0-9_]*$')) is not none
      - (postgres_users_schema | regex_search('^[a-z_][a-z0-9_]*$')) is not none
      - postgres_initial_schema != 'public'
      - postgres_organizers_schema != 'public'
      - postgres_users_schema != 'public'
      - postgres_max_connections | int >= 1
      - postgres_max_connections | int <= 262143
    fail_msg: >-
      PostgreSQL application roles must be distinct and database/role/schema
      names must be safe lowercase SQL identifiers. The application database
      cannot be postgres, application schemas cannot be public, and
      postgres_max_connections must be between 1 and 262143.

- name: Check the PostgreSQL data directory
  ansible.builtin.stat:
    path: "{{ postgres_data_path }}"
  register: postgres_data_directory
  when: binturo_user_available | default(false)

- name: Create the initial PostgreSQL data directory
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.file:
    path: "{{ postgres_data_path }}"
    state: directory
    mode: "0750"
  when:
    - binturo_user_available | default(false)
    - not postgres_data_directory.stat.exists

- name: Check whether the target PostgreSQL data directory is initialized
  ansible.builtin.stat:
    path: "{{ postgres_data_path }}/PG_VERSION"
  register: postgres_target_data
  when: binturo_user_available | default(false)

- name: Check for the legacy PostgreSQL Docker volume
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - inspect
      - "{{ postgres_legacy_volume_name }}"
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  register: postgres_legacy_volume
  changed_when: false
  failed_when: postgres_legacy_volume.rc not in [0, 1]
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)

- name: Stop PostgreSQL before migrating its legacy volume
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - stop
      - "{{ postgres_container_name }}"
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  register: postgres_stop_for_migration
  changed_when: postgres_stop_for_migration.rc == 0
  failed_when: postgres_stop_for_migration.rc not in [0, 1]
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)
    - not postgres_target_data.stat.exists
    - postgres_legacy_volume.rc == 0
    - not ansible_check_mode

- name: Migrate PostgreSQL from the legacy volume to binturo_root
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /bin/sh
      - --volume
      - "{{ postgres_legacy_volume_name }}:/source:ro"
      - --volume
      - "{{ postgres_data_path }}:/target"
      - "{{ postgres_image }}"
      - -c
      - cp -a /source/. /target/ && chown -R postgres:postgres /target
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)
    - not postgres_target_data.stat.exists
    - postgres_legacy_volume.rc == 0
    - not ansible_check_mode

- name: Prepare ownership of a new PostgreSQL data directory
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /bin/sh
      - --volume
      - "{{ postgres_data_path }}:/target"
      - "{{ postgres_image }}"
      - -c
      - chown postgres:postgres /target
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)
    - not postgres_target_data.stat.exists
    - postgres_legacy_volume.rc == 1
    - not ansible_check_mode

- name: Write PostgreSQL secret files
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: "{{ binturo_root }}/secrets/{{ item.name }}"
    owner: "{{ binturo_user }}"
    group: "{{ binturo_group }}"
    mode: "0600"
  loop:
    - { name: postgres_superuser_password, value: "{{ postgres_superuser_password }}" }
    - { name: postgres_platform_password, value: "{{ postgres_platform_password }}" }
    - { name: postgres_organizers_password, value: "{{ postgres_organizers_password }}" }
    - { name: postgres_backup_password, value: "{{ postgres_backup_password }}" }
  no_log: true
  when: binturo_user_available | default(false)

- name: Install PostgreSQL role and privilege setup SQL
  ansible.builtin.copy:
    src: setup_db_roles.sql
    dest: "{{ binturo_root }}/compose/setup_db_roles.sql"
    owner: "{{ binturo_user }}"
    group: "{{ binturo_group }}"
    mode: "0640"
  when: binturo_user_available | default(false)

- name: Remove obsolete PostgreSQL bootstrap SQL filename
  ansible.builtin.file:
    path: "{{ binturo_root }}/compose/postgres-bootstrap.sql"
    state: absent
  when: binturo_user_available | default(false)

- name: Install PostgreSQL bootstrap script
  ansible.builtin.template:
    src: bootstrap.sh.j2
    dest: "{{ binturo_root }}/compose/postgres-bootstrap.sh"
    owner: "{{ binturo_user }}"
    group: "{{ binturo_group }}"
    mode: "0750"
  when: binturo_user_available | default(false)

- name: Install PostgreSQL Compose definition
  ansible.builtin.template:
    src: compose.postgres.yml.j2
    dest: "{{ binturo_root }}/compose/compose.postgres.yml"
    owner: "{{ binturo_user }}"
    group: "{{ binturo_group }}"
    mode: "0640"
  when: binturo_user_available | default(false)

- name: Check whether the existing database network is internal
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - --format
      - "{{ '{{' }}.Internal{{ '}}' }}"
      - "binturo_{{ environment_name }}_database"
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  check_mode: false
  register: postgres_database_network
  changed_when: false
  failed_when: postgres_database_network.rc not in [0, 1]
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)

- name: Check whether the monitoring Compose definition exists
  ansible.builtin.stat:
    path: "{{ binturo_root }}/compose/compose.monitoring.yml"
  register: postgres_monitoring_compose
  when: binturo_user_available | default(false)

- name: Stop monitoring before replacing the internal database network
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "binturo-monitoring-{{ environment_name }}"
      - --file
      - "{{ binturo_root }}/compose/compose.monitoring.yml"
      - down
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)
    - postgres_database_network.rc == 0
    - postgres_database_network.stdout | trim == 'true'
    - postgres_monitoring_compose.stat.exists
    - not ansible_check_mode

- name: Stop PostgreSQL before replacing the internal database network
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "binturo-{{ environment_name }}"
      - --file
      - "{{ binturo_root }}/compose/compose.postgres.yml"
      - down
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)
    - postgres_database_network.rc == 0
    - postgres_database_network.stdout | trim == 'true'
    - not ansible_check_mode

- name: Remove the obsolete internal database network
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - network
      - rm
      - "binturo_{{ environment_name }}_database"
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  register: postgres_remove_internal_network
  changed_when: postgres_remove_internal_network.rc == 0
  failed_when: postgres_remove_internal_network.rc not in [0, 1]
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)
    - postgres_database_network.rc == 0
    - postgres_database_network.stdout | trim == 'true'
    - not ansible_check_mode

- name: Start PostgreSQL
  become: true
  become_user: "{{ binturo_user }}"
  community.docker.docker_compose_v2:
    project_src: "{{ binturo_root }}/compose"
    files:
      - compose.postgres.yml
    project_name: "binturo-{{ environment_name }}"
    services:
      - postgres
    state: present
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)

- name: Wait until PostgreSQL is healthy
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    cmd: "docker inspect --format={{ '{{' }}.State.Health.Status{{ '}}' }} {{ postgres_container_name }}"
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  register: postgres_health
  changed_when: false
  retries: 30
  delay: 2
  until: postgres_health.stdout == "healthy"
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)

- name: Run setup_db_roles.sql on the inventory application database
  become: true
  become_user: "{{ binturo_user }}"
  ansible.builtin.command:
    cmd: >-
      docker compose
      --project-name binturo-{{ environment_name }}
      --file {{ binturo_root }}/compose/compose.postgres.yml
      run --rm postgres-bootstrap
  environment:
    DOCKER_HOST: "{{ docker_rootless_socket }}"
  register: postgres_setup_db_roles
  changed_when: false
  when:
    - binturo_user_available | default(false)
    - binturo_docker_available | default(false)
    - not ansible_check_mode
