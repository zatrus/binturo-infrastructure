---
- name: Create Binturo system group
  ansible.builtin.group:
    name: "{{ binturo_group }}"
    gid: "{{ binturo_gid }}"
    state: present

- name: Create unprivileged Binturo user
  ansible.builtin.user:
    name: "{{ binturo_user }}"
    uid: "{{ binturo_uid }}"
    group: "{{ binturo_group }}"
    home: "/home/{{ binturo_user }}"
    shell: /bin/bash
    create_home: true
    state: present
    password_lock: true

- name: Enable persistent user services after logout
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ binturo_user }}"
    creates: "/var/lib/systemd/linger/{{ binturo_user }}"

- name: Check whether Binturo user currently exists
  ansible.builtin.command:
    cmd: "getent passwd {{ binturo_user }}"
  check_mode: false
  changed_when: false
  failed_when: false
  register: binturo_user_check

- name: Record Binturo user availability
  ansible.builtin.set_fact:
    binturo_user_available: "{{ binturo_user_check.rc == 0 }}"

- name: Create Ansible remote temporary directory for Binturo user
  ansible.builtin.file:
    path: "/home/{{ binturo_user }}/.ansible/tmp"
    state: directory
    owner: "{{ binturo_user }}"
    group: "{{ binturo_group }}"
    mode: "0700"
  when: binturo_user_available
