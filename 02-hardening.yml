---
- name: Finalize VPS hardening on the target SSH port
  hosts: hardened_hosts
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require a connection through the target SSH port
      ansible.builtin.assert:
        that:
          - (ansible_port | int) == (custom_ssh_port | int)
          - ansible_user == custom_admin_user
        fail_msg: Stage 2 must use the target administrator and custom SSH port.

  tasks:
    - name: Enable IPv6 support in UFW
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: IPV6=yes
        state: present
      notify: Reload UFW

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Install Fail2Ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: true

    - name: Ensure Fail2Ban is enabled and running
      ansible.builtin.systemd_service:
        name: fail2ban.service
        state: started
        enabled: true
      when: not ansible_check_mode or 'fail2ban' in ansible_facts.packages

    - name: Configure the Fail2Ban SSH jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible. Local changes will be overwritten.
          [sshd]
          enabled = true
          port = {{ custom_ssh_port }}
          backend = systemd
          mode = normal
          maxretry = {{ fail2ban_sshd_maxretry }}
          findtime = {{ fail2ban_sshd_findtime }}
          bantime = {{ fail2ban_sshd_bantime }}
          bantime.increment = {{ fail2ban_sshd_bantime_increment | bool | lower }}
          bantime.maxtime = {{ fail2ban_sshd_bantime_maxtime }}
      notify: Restart Fail2Ban
      when: not ansible_check_mode or 'fail2ban' in ansible_facts.packages

    - name: Validate the Fail2Ban configuration
      ansible.builtin.command: /usr/bin/fail2ban-client -t
      changed_when: false
      when: not ansible_check_mode

    - name: Apply pending Fail2Ban changes
      ansible.builtin.meta: flush_handlers

    - name: Keep only the target port in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port\s+'
        line: "Port {{ custom_ssh_port }}"
        state: present
      notify: Restart SSH stack

    - name: Disable direct root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin\s+'
        line: PermitRootLogin no
        state: present
      notify: Restart SSH stack

    - name: Listen only on the target SSH port
      ansible.builtin.copy:
        dest: /etc/systemd/system/ssh.socket.d/listen.conf
        mode: '0644'
        content: |
          [Socket]
          ListenStream=
          ListenStream=0.0.0.0:{{ custom_ssh_port }}
          ListenStream=[::]:{{ custom_ssh_port }}
      notify: Restart SSH stack

    - name: Validate the SSH daemon configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      when: not ansible_check_mode

    - name: Apply pending SSH changes
      ansible.builtin.meta: flush_handlers

    - name: Verify the target SSH port after restart
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ custom_ssh_port }}"
        timeout: 30
        connect_timeout: 5
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    - name: Remove the bootstrap SSH port from UFW
      community.general.ufw:
        rule: allow
        port: "{{ bootstrap_ssh_port }}"
        proto: tcp
        delete: true
      notify: Restart Fail2Ban

    - name: Remove the legacy OpenSSH profile rule from UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH
        delete: true
      notify: Restart Fail2Ban

    - name: Remove the legacy HTTP port from UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp
        delete: true
      notify: Restart Fail2Ban

    - name: Ensure the target SSH port is allowed by UFW
      community.general.ufw:
        rule: allow
        port: "{{ custom_ssh_port }}"
        proto: tcp
      notify: Restart Fail2Ban

    - name: Ensure HTTPS is allowed by UFW
      community.general.ufw:
        rule: allow
        port: "{{ https_port }}"
        proto: tcp
      notify: Restart Fail2Ban

    - name: Deny incoming traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing traffic by default
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW
      community.general.ufw:
        state: enabled
      notify: Restart Fail2Ban

    - name: Apply pending firewall and Fail2Ban changes
      ansible.builtin.meta: flush_handlers

    - name: Verify that the SSH jail is active
      ansible.builtin.command: /usr/bin/fail2ban-client status sshd
      changed_when: false
      when: not ansible_check_mode

    - name: Show completion information
      ansible.builtin.debug:
        msg:
          - "Hardening completed for {{ inventory_hostname }}."
          - "SSH: ssh -p {{ custom_ssh_port }} {{ custom_admin_user }}@{{ ansible_host }}"

  handlers:
    - name: Reload UFW
      ansible.builtin.command: /usr/sbin/ufw reload
      changed_when: true

    - name: Restart Fail2Ban
      ansible.builtin.systemd_service:
        name: fail2ban.service
        state: restarted
      when: not ansible_check_mode or 'fail2ban' in ansible_facts.packages

    - name: Reload systemd configuration
      ansible.builtin.systemd_service:
        daemon_reload: true
      listen: Restart SSH stack

    - name: Restart the SSH socket on the target port
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: restarted
        enabled: true
      listen: Restart SSH stack

    - name: Restart the SSH service
      ansible.builtin.systemd_service:
        name: ssh.service
        state: restarted
      listen: Restart SSH stack
