---

custom_admin_user: binturo_dev
custom_ssh_port: 2918
custom_admin_authorized_key_file: /home/gwerko/.ssh/binturo_ansible_dev.pub

environment_name: dev

postgres_max_connections: 200
organizers_db_pool_size: 30
organizers_db_max_overflow: 140

binturo_domains:
  www: www.binturo.warszawa
  platform: platform.binturo.warszawa
  organizers: app.binturo.warszawa
  api: api.binturo.warszawa

caddy_redirect_domains:
  - binturo.warszawa
  - "*.binturo.warszawa"

# The .warszawa development names are not eligible for public ACME certificates.
caddy_tls_internal: true

postgres_database: binturo_dev_warszawa
postgres_data_path: "{{ binturo_root }}/persistent/postgres"

organizers_email_client: mock
organizers_mailersend_from_email: ""
organizers_mailersend_from_name: Binturo
organizers_smtp_host: ""
organizers_smtp_port: 587
organizers_smtp_username: "{{ vault_organizers_smtp_username | default('') }}"
organizers_smtp_password: "{{ vault_organizers_smtp_password | default('') }}"
organizers_smtp_from_email: ""
organizers_smtp_from_name: Binturo
organizers_smtp_use_tls: true
organizers_smtp_use_ssl: false
platform_email_client: mock
platform_mailersend_from_email: ""
platform_mailersend_from_name: Binturo Platform
platform_smtp_host: ""
platform_smtp_port: 587
platform_smtp_username: "{{ vault_platform_smtp_username | default('') }}"
platform_smtp_password: "{{ vault_platform_smtp_password | default('') }}"
platform_smtp_from_email: ""
platform_smtp_from_name: Binturo Platform
platform_smtp_use_tls: true
platform_smtp_use_ssl: false

prometheus_retention_time: 15d
prometheus_retention_size: 10GB

# Vaulted values are documented in inventories/dev/vault.example.yml and loaded
# from group_vars/all/vault.yml.
postgres_superuser_password: "{{ vault_postgres_superuser_password }}"
postgres_platform_password: "{{ vault_postgres_platform_password }}"
postgres_organizers_password: "{{ vault_postgres_organizers_password }}"
postgres_backup_password: "{{ vault_postgres_backup_password }}"
organizers_jwt_secret: "{{ vault_organizers_jwt_secret }}"
platform_jwt_secret: "{{ vault_platform_jwt_secret }}"
organizers_mailersend_api_key: "{{ vault_organizers_mailersend_api_key | default('') }}"
platform_mailersend_api_key: "{{ vault_platform_mailersend_api_key | default('') }}"

# Password used by the SSH account for sudo/become. The value is stored in Vault.
ansible_become_password: "{{ vault_ansible_become_password }}"
