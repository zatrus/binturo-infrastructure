---

custom_admin_user: binturo_s
custom_ssh_port: 4285
custom_admin_authorized_key_file: /home/gwerko/ovh/binturo-ovh-staging.pub
environment_name: staging

binturo_domains:
  www: www-staging.binturo.com
  platform: platform-staging.binturo.com
  organizers: app-staging.binturo.com

# Cloudflare terminates visitor TLS and validates this host with Origin CA.
caddy_tls_internal: false
caddy_tls_cloudflare_origin: true
caddy_cloudflare_origin_certificate: "{{ vault_cloudflare_origin_certificate }}"
caddy_cloudflare_origin_private_key: "{{ vault_cloudflare_origin_private_key }}"

postgres_database: binturo_staging
postgres_data_path: "{{ binturo_root }}/persistent/postgres"

organizers_email_client: mock
organizers_mailersend_from_email: ""
organizers_mailersend_from_name: Binturo
platform_email_client: mock
platform_mailersend_from_email: ""
platform_mailersend_from_name: Binturo Platform

prometheus_retention_time: 10d
prometheus_retention_size: 10GB

# Vaulted values are documented in inventories/prod/vault.example.yml and loaded
# from group_vars/all/vault.yml.
postgres_superuser_password: "{{ vault_postgres_superuser_password }}"
postgres_platform_password: "{{ vault_postgres_platform_password }}"
postgres_organizers_password: "{{ vault_postgres_organizers_password }}"
postgres_backup_password: "{{ vault_postgres_backup_password }}"
organizers_jwt_secret: "{{ vault_organizers_jwt_secret }}"
platform_jwt_secret: "{{ vault_platform_jwt_secret }}"
organizers_mailersend_api_key: "{{ vault_organizers_mailersend_api_key | default('') }}"
platform_mailersend_api_key: "{{ vault_platform_mailersend_api_key | default('') }}"

# Password used by the SSH account for sudo/become. The value is stored in Vault.
ansible_become_password: "{{ vault_ansible_become_password }}"
